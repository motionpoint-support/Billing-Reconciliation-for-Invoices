<!-- ============ SCENE 0 · INTRO ============ -->
<template id="scene-0">
<div style="position: absolute; left: 0; top: 72px; width: 1280px; height: 648px;">
<div style="position: absolute; left: 0; top: 24px; width: 1280px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;"><div style="font-size: 16px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: #3E8A2A; animation: up .8s .4s both;">Customer Support &middot; New Agent Training</div><h1 class="disp" style="margin: 0; font-size: 60px; line-height: 1.05; font-weight: 700; color: #0B2545; animation: up .9s .9s both;">Invoice Reconciliation</h1><p style="margin: 0; font-size: 23px; color: #3B4F6B; max-width: 1000px; animation: up .9s 1.6s both;">How customers check the cost of work done under any case, by themselves.</p></div>
<div style="position: absolute; left: 40px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #DCE7F7; border: 3px solid #1466F0; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 5s both;"><span class="eb" style="color: #1466F0;">What</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">An area in the MP+ portal that lists every invoiced item, with its details and cost.</span></div>
<div style="position: absolute; left: 450px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #E5F4DE; border: 3px solid #2F7A22; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 9s both;"><span class="eb" style="color: #2F7A22;">Why it matters</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">Transparency. Customers can match charges to their invoice and to a case, on their own.</span></div>
<div style="position: absolute; left: 860px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #FCE3CC; border: 3px solid #C2410C; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 13s both;"><span class="eb" style="color: #C2410C;">Your role</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">Show customers where to look and how the math works, and share the tutorial.</span></div>
<div style="position: absolute; left: 160px; top: 436px; width: 960px; height: 104px; border-radius: 20px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 18px; padding: 0 30px; animation: up .7s 19s both;"><svg width="40" height="40" style="flex-shrink: 0; color: #F6C453;"><use href="#dc-warn"></use></svg><span style="font-size: 21px; font-weight: 900; line-height: 1.4;">You guide. Invoice disputes and adjustments go to the customer&rsquo;s CXM.</span></div>

</button>
<div style="width: 1px; height: 30px; background: #2A3E5C; margin: 0 4px;"></div>

</div>

</div>
</div>


</div>
</div>
<script>
const STEP_HTML = "<div style=\"height: 52px; padding: 0 18px 0 6px; border-radius: 26px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(11,37,69,.22); animation: pop 0.78s ease both;\">\n<span class=\"disp\" style=\"width: 40px; height: 40px; border-radius: 20px; background: #5DB645; color: #0B2545; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;\">{{st.n}}</span>\n<span style=\"font-size: 15px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;\">Part {{st.n}} of 7</span>\n</div>";
const SUB_OPEN = "<div style=\"position: absolute; left: 48px; right: 48px; top: 0; height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; line-height: 1.3; font-weight: 700; color: #F4F7FB; animation: up 0.7s ease both;\">";
function fit(){ const s = Math.min(window.innerWidth / 1280, window.innerHeight / 870); document.getElementById('fit').style.transform = 'scale(' + s + ')'; }
window.addEventListener('resize', fit); fit();
class Player {
  constructor() {
    this.state = { scene: 0, el: 0, playing: false, started: false, ended: false, music: true, subsOn: true };
    this.ctx = null;
  }
  durs() { return [26000, 86000, 44000, 62000, 42000, 44000, 26000, 90000]; }
  subLines() {
    return [[[0, "Welcome! This video covers Invoice Reconciliation."], [5000, "It's an area in the MP+ portal that lists every invoiced item, with its details and cost."], [9000, "It brings transparency. Customers can match charges to their invoice, and to a case, on their own."], [13000, "Your role: show customers where to look and how the math works, and share the tutorial."], [19000, "You guide. Invoice disputes and adjustments go to the customer's CXM."]],
      [[0, "Part 1: open Invoice Reconciliation."], [4000, "The customer logs in to their MP+ account. It's the same portal where they open cases."], [20000, "On the home page, they click Invoice Reconciliation in the top menu."], [36000, "They'll see the list of all invoices, one per month, with the period start and end."], [42000, "They click the month they want to review."], [52000, "The invoice shows Online Line Items on the left, each with its priority: Standard, Critical, or Express."], [57000, "And Offline Line Items on the right, for offline cases."], [61000, "Note: this section doesn't include translations completed as part of proxy maintenance."], [68000, "Clicking a line item, for example Technical Services, Standard, shows the Contributing Cases."], [72000, "Each case number, and the time billed for it. That's what they use to calculate."]],
      [[0, "Part 2: what shows up on the invoice."], [4000, "Image design services: any image MotionPoint processed and translated."], [7000, "Offline formatting services: offline files that needed a specific format, like PDF, Excel, Word, or PowerPoint."], [10000, "Technical services: Platform Engineering, Support, or QA work, billed at the hourly rate in the contract."], [15000, "These are examples. Invoice items include, but aren't limited to, these."], [23000, "Most of the time, MotionPoint technology mimics the English origin site automatically, with nothing to do."], [27000, "But when the origin site changes, or something is added, our team may need to adjust the configuration, so the translated site keeps working and stays aligned."], [31000, "That time is billable, by the hour."]],
      [[0, "Part 3: calculate what a case cost."], [4000, "First, pick the right line item. Online covers technical, review, image, and translation services. Offline covers formatting and offline translation."], [10000, "Each service and priority is its own line item, with its own rate in the contract. Standard and Express are billed differently."], [23000, "Take the case's quantity, for example 1.5 hours, and multiply by the contracted rate for that line item."], [27000, "The rate isn't on this screen. It comes from the customer's contract."], [31000, "In this example, 1.5 hours times 150 dollars is 225 dollars. If the case shows up under more than one line item, add them up."], [42000, "Then compare it with the invoice for the same month. The totals should match."], [49000, "If it doesn't match, or is still unclear, the customer's CXM helps with invoice questions."]],
      [[0, "Part 4: guide the customer."], [4000, "Give them five simple steps."], [5500, "Log in to MP+, click Invoice Reconciliation, open the invoice month, and click the line item, Online or Offline, with its priority."], [10000, "Find the case number under Contributing Cases, with its hours. Multiply by the contracted rate, and compare with the invoice."], [22000, "Here's an example reply: point them to Invoice Reconciliation, explain the math in one line, share the tutorial, and CC the CXM."]],
      [[0, "Part 5: quick answers."], [4000, "Why was I charged for technical services? A change on the English site needed PE, Support, or QA work. That time is billable."], [7000, "Where do I see the charges? In MP+, under Invoice Reconciliation."], [10000, "How is it calculated? Hours or quantity, times the rate in their contract."], [13000, "What's an image design charge? An image MotionPoint processed and translated."], [24000, "What's offline formatting? Offline files formatted as PDF, Excel, Word, or PowerPoint."], [27000, "What's my hourly rate? It's in their contract. Their CXM can confirm it."], [30000, "This charge looks wrong. Their CXM handles invoice questions and adjustments."], [33000, "Is there a guide? Yes: share the tutorial video link."]],
      [[0, "Part 6: guide, don't decide."], [4000, "You show where to look, explain the line items and the math, and share the tutorial."], [8000, "The CXM handles invoice disputes, adjustments or credits, contract rates, and any billing decision."], [12000, "Keep the CXM CC'd on invoice conversations."]],
      [[0, "Part 7: practice. What would you do?"], [4000, "A customer asks: how much did case 00123456 cost us?"], [9000, "Guide them to MP+, Invoice Reconciliation, the month, the line item, and Contributing Cases: their case and its hours. Share the tutorial."], [14000, "A Technical services line shows two hours at 150 dollars an hour."], [19000, "Two times 150 is 300 dollars. Hours times the contracted hourly rate."], [24000, "Why are we paying for technical work at all?"], [29000, "A change on their English origin site needed PE, Support, or QA work. That time is billable."], [34000, "The reconciliation total doesn't match their invoice."], [39000, "Check it's the same month. Still off? Loop in their CXM."], [44000, "What's our hourly rate?"], [49000, "It's in their contract. Their CXM can confirm it."], [54000, "Can you credit this charge?"], [59000, "That's not your call. The CXM handles adjustments, so CC them."], [66000, "Quick recap."], [82000, "Transparency builds trust: help them find the answer. Thanks for watching!"]]];
  }
  labels() { return ["Intro", "Open it", "Charges", "Calculate", "Guide", "Answers", "Roles", "Practice"]; }

  /* ---------- original background jazz, synthesized live ---------- */
  bars() {
    // [bass walk (MIDI), chord voicing (MIDI)] — ii-V-I in F with turnarounds, 80 bpm swing
    return [
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[41, 45, 48, 49], [57, 60, 64, 67]], // Fmaj9
      [[50, 48, 45, 44], [54, 60, 64, 69]], // D9
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[45, 48, 52, 51], [60, 64, 67, 71]], // Am9
      [[50, 48, 45, 44], [54, 60, 64, 69]]  // D9
    ];
  }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  initAudio() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.0);
      const noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.ctx = ctx; this.master = master; this.noise = noise;
      this.beat = 0; this.nextT = 0;
      return true;
    } catch (e) { return false; }
  }
  pianoNote(m, t, vel, dur) {
    const c = this.ctx;
    const f = this.hz(m);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(900, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vel * 0.3, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(this.master);
    [[1, 1], [2, 0.28], [3, 0.08]].forEach((h) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * h[0];
      const hg = c.createGain(); hg.gain.value = h[1];
      o.connect(hg); hg.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  pianoChord(notes, t, vel, dur) {
    notes.forEach((m, i) => this.pianoNote(m, t + i * 0.018, vel, dur));
  }
  tap(t, vol, dur, freq) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  scheduleBeat(i, t) {
    const spb = 60 / 80;
    const sw = spb * 2 / 3;
    const barIx = Math.floor(i / 4) % 8;
    const bar = this.bars()[barIx];
    const b = i % 4;
    this.tap(t, 0.014, 0.25, 7500);
    if (b === 1 || b === 3) {
      this.tap(t + sw, 0.01, 0.18, 7500);
      this.tap(t, 0.012, 0.05, 9500);
    }
    if (b === 0) {
      this.pianoNote(bar[0][0] + 12, t, 0.05, 2.4);
      this.pianoChord(bar[1], t + 0.03, 0.028, 2.2);
    }
    const v = Math.floor(i / 4) % 2;
    if (b === 2 && v === 0) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
    if (b === 1 && v === 1) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
  }
  schedule() {
    const c = this.ctx;
    if (!c || c.state !== 'running' || !this.musicLive) return;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < c.currentTime + 0.3) {
      this.scheduleBeat(this.beat, this.nextT);
      this.beat = (this.beat + 1) % 32;
      this.nextT += 60 / 80;
    }
  }
  musicStart() {
    if (!this.state.music || !this.initAudio()) return;
    const c = this.ctx;
    try { c.resume(); } catch (e) {}
    if (!this.musicLive) {
      this.musicLive = true;
      this.beat = 0;
      this.nextT = c.currentTime + 0.1;
      this.master.gain.cancelScheduledValues(c.currentTime);
      this.master.gain.setValueAtTime(0.0001, c.currentTime);
      this.master.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 1.5);
    }
  }
  musicStop(fade) {
    if (!this.ctx) return;
    const c = this.ctx;
    this.musicLive = false;
    const now = c.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(Math.max(this.master.gain.value, 0.0001), now);
    this.master.gain.exponentialRampToValueAtTime(0.0001, now + (fade || 0.3));
  }
  musicPause() { if (this.ctx) { try { this.ctx.suspend(); } catch (e) {} } }
  musicResume() { if (this.ctx && this.state.music) { try { this.ctx.resume(); } catch (e) {} } }

  componentDidMount() {
    this.iv = setInterval(() => this.tick(), 200);
    this.au = setInterval(() => this.schedule(), 60);
  }
  componentWillUnmount() {
    clearInterval(this.iv); clearInterval(this.au); clearTimeout(this.to);
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} }
  }
  tick() {
    const s = this.state;
    if (!s.playing || s.scene < 0) return;
    const d = this.durs();
    const el = s.el + 200;
    if (el >= d[s.scene]) {
      if (s.scene < d.length - 1) this.setState({ scene: s.scene + 1, el: 0 });
      else { this.setState({ el: d[s.scene], playing: false, ended: true }); this.musicStop(3); }
    } else {
      this.setState({ el: el });
    }
  }
  go(i, off) {
    off = off || 0;
    clearTimeout(this.to);
    this.musicStart();
    this.musicResume();
    this.setState({ scene: -1, el: 0 });
    this.to = setTimeout(() => {
      this.setState({ scene: i, el: off, started: true, playing: true, ended: false });
      if (off) setTimeout(() => this.sync(off), 60);
    }, 40);
  }
  sync(off) {
    try {
      const st = document.querySelector('.stage');
      if (!st || !st.getAnimations) return;
      st.getAnimations({ subtree: true }).forEach((a) => { try { a.currentTime = off; } catch (e) {} });
    } catch (e) {}
  }
  jump(delta) {
    const d = this.durs();
    const s = this.state;
    const cur = s.scene < 0 ? 0 : s.scene;
    let t = 0;
    for (let i = 0; i < cur; i++) t += d[i];
    t += (s.scene < 0 || !s.started) ? 0 : s.el;
    const total = d.reduce((a, b) => a + b, 0);
    t = Math.max(0, Math.min(t + delta, total - 500));
    let i = 0;
    while (i < d.length - 1 && t >= d[i]) { t -= d[i]; i++; }
    this.go(i, t);
  }
  fmt(ms) {
    const t = Math.floor(ms / 1000);
    const m = Math.floor(t / 60);
    const sec = t % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  renderVals() {
    const s = this.state;
    const d = this.durs();
    const total = d.reduce((a, b) => a + b, 0);
    const cur = s.scene < 0 ? 0 : s.scene;
    let done = 0;
    for (let i = 0; i < cur; i++) done += d[i];
    done += s.scene < 0 ? 0 : s.el;
    const vis = s.started ? s.scene : -2;
    const chapters = this.labels().map((label, i) => ({
      label: label,
      cls: s.started && i === cur ? 'on' : (s.started && i < cur ? 'done' : ''),
      go: () => this.go(i)
    }));
    return {
      s0: vis === 0, s1: vis === 1, s2: vis === 2, s3: vis === 3, s4: vis === 4, s5: vis === 5, s6: vis === 6, s7: vis === 7,
      showCover: !s.started,
      pauseCls: s.playing ? '' : 'paused',
      isPlaying: s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? 'Pause' : (s.ended ? 'Replay' : 'Play'),
      progressW: (Math.min(1, done / total) * 100).toFixed(2) + '%',
      timeLabel: this.fmt(done) + ' / ' + this.fmt(total),
      chapters: chapters,
      steps: [1, 2, 3, 4, 5, 6, 7].map((n) => ({ n: n, on: s.started && s.scene >= 0 && s.scene === n })),
      showSubs: s.subsOn && s.started,
      subs: (() => {
        const L = s.scene >= 0 ? this.subLines()[s.scene] : [];
        let act = -1;
        L.forEach((c, i) => { if (s.el >= c[0]) act = i; });
        return L.map((c, i) => ({ text: c[1], on: i === act }));
      })(),
      subsOn: s.subsOn,
      subsLabel: s.subsOn ? 'Hide captions' : 'Show captions',
      subsColor: s.subsOn ? '#8FD16F' : '#A9B8CC',
      toggleSubs: () => this.setState({ subsOn: !this.state.subsOn }),
      musicOn: s.music,
      musicOff: !s.music,
      musicLabel: s.music ? 'Music on' : 'Music off',
      toggleMusic: () => {
        const on = !this.state.music;
        this.setState({ music: on }, () => {
          if (!on) this.musicStop(0.6);
          else if (this.state.playing) this.musicStart();
        });
      },
      togglePlay: () => {
        if (!this.state.started || this.state.ended) this.go(0);
        else {
          const playing = !this.state.playing;
          if (playing) this.musicResume(); else this.musicPause();
          this.setState({ playing: playing });
        }
      },
      replay: () => this.go(0),
      back10: () => this.jump(-10000),
      fwd10: () => this.jump(10000),
      prev: () => this.go(Math.max(0, cur - 1)),
      next: () => this.go(Math.min(d.length - 1, cur + 1))
    };
  }
}

Player.prototype.setState = function (obj, cb) { Object.assign(this.state, obj); this.render(); if (cb) cb(); };
Player.prototype.render = function () {
  const v = this.renderVals();
  const $ = (id) => document.getElementById(id);
  const s = this.state;
  const vis = s.started ? s.scene : -2;
  if (vis !== this._vis) {
    this._vis = vis;
    const tpl = $('scene-' + vis);
    $('sceneHost').innerHTML = tpl ? tpl.innerHTML : '';
  }
  $('stage').classList.toggle('paused', !s.playing);
  $('cover').hidden = !v.showCover;
  const st = v.steps.find((x) => x.on);
  const stn = st ? st.n : 0;
  if (stn !== this._step) { this._step = stn; $('steps').innerHTML = stn ? STEP_HTML.split('{{st.n}}').join(String(stn)) : ''; }
  const sb = v.showSubs ? v.subs.find((x) => x.on) : null;
  const key = sb ? s.scene + '|' + sb.text : '';
  if (key !== this._sub) {
    this._sub = key;
    $('subs').innerHTML = '';
    if (sb) { const d = document.createElement('div'); d.innerHTML = SUB_OPEN + '</div>'; d.firstChild.textContent = sb.text; $('subs').appendChild(d.firstChild); }
  }
  $('prog').style.width = v.progressW;
  $('timeLabel').textContent = v.timeLabel;
  $('playLabel').textContent = v.playLabel;
  $('playBtn').setAttribute('aria-label', v.playLabel);
  $('icoPause').hidden = !v.isPlaying; $('icoPlay').hidden = v.isPlaying;
  $('musicLabel').textContent = v.musicLabel; $('musicBtn').setAttribute('aria-label', v.musicLabel); $('musicBtn').setAttribute('aria-pressed', String(v.musicOn));
  $('icoMusicOn').hidden = !v.musicOn; $('icoMusicOff').hidden = v.musicOn;
  $('subsBtn').setAttribute('aria-label', v.subsLabel); $('subsBtn').setAttribute('aria-pressed', String(v.subsOn)); $('subsIcon').setAttribute('stroke', v.subsColor);
  const ck = v.chapters.map((c) => c.cls).join(',');
  if (ck !== this._chips) {
    this._chips = ck;
    const host = $('chapters'); host.innerHTML = '';
    v.chapters.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + c.cls; b.textContent = c.label;
      b.addEventListener('click', () => this.go(i)); host.appendChild(b);
    });
  }
};
const P = new Player();
const call = (k) => () => P.renderVals()[k]();
document.getElementById('coverPlay').addEventListener('click', call('togglePlay'));
document.getElementById('playBtn').addEventListener('click', call('togglePlay'));
document.getElementById('replayBtn').addEventListener('click', call('replay'));
document.getElementById('prevBtn').addEventListener('click', call('prev'));
document.getElementById('back10Btn').addEventListener('click', call('back10'));
document.getElementById('fwd10Btn').addEventListener('click', call('fwd10'));
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { e.preventDefault(); call('back10')(); } else if (e.key === 'ArrowRight') { e.preventDefault(); call('fwd10')(); } else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); call('togglePlay')(); } });
document.getElementById('nextBtn').addEventListener('click', call('next'));
document.getElementById('musicBtn').addEventListener('click', call('toggleMusic'));
document.getElementById('subsBtn').addEventListener('click', call('toggleSubs'));
P.render();
P.componentDidMount();

</script>
